<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Order</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, sans-serif;
background:#f4f6f8;
}

.header-bar{
width:100%;
height:70px;
background:#000;
display:flex;
align-items:center;
padding:0 30px;
position: relative;
}

.header-bar a{
display:flex;
align-items:center;
z-index:10;
}

.header-bar img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid #000;
background:#fff;
}

.header-title{
color:#dc8c8c;
font-size:22px;
font-weight:bold;
text-transform:uppercase;
position:absolute;
left:50%;
transform:translateX(-50%);
}

.wrapper{
display:flex;
gap:30px;
padding:30px;
}

.container{
background:#fff;
width:450px;
padding:18px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.goods-panel{
background:#fff;
width:720px;
padding:18px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
text-align:center;
font-size:18px;
margin-bottom:14px;
}

.field{
margin-bottom:12px;
position:relative;
}

label{
font-size:13px;
font-weight:bold;
display:block;
margin-bottom:4px;
}

input,select{
width:100%;
padding:7px;
font-size:13px;
}

.voucher{
display:flex;
}

.voucher input{
border:1px solid #ccc;
width: 100%;
background-color: #f9f9f9; 
}

.update-btn,.back-btn{
width:100%;
padding:9px;
margin-top:10px;
font-size:14px;
border:none;
border-radius:5px;
cursor:pointer;
color:#fff;
}

.update-btn{background:#28a745;}
.back-btn{background:#0d6efd;}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
font-size:13px;
text-align:center;
}

th{
background:#f2f2f2;
}

#confirmModal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index: 100;
}

.modal-box{
background:#fff;
width:650px;
padding:18px;
border-radius:8px;
max-height:80vh;
overflow:auto;
}

.confirm-btn,.cancel-btn{
padding:12px 24px;
font-size:15px;
border:none;
border-radius:6px;
cursor:pointer;
}

.confirm-btn{background:#28a745; color:#fff;}
.cancel-btn{background:#dc3545; color:#fff;}
</style>
</head>

<body>

<div class="header-bar">
<a href="../html/home.html">
<img src="../images/CEPL.jpg">
</a>
<span class="header-title">Purchase Order Management</span>
</div>

<div class="wrapper">

<div class="container">
<h2>Purchase Order</h2>

<div class="field">
<label>Upload PO PDF</label>
<input type="file" id="po_pdf" accept="application/pdf" required>
</div>

<div class="field">
<label>Voucher No</label>
<div class="voucher">

<input type="text" id="voucher" readonly>
</div>
</div>

<div class="field">
<label>Date</label>
<input type="date" id="poDate" readonly>
</div>

<div class="field">
<label>Supplier</label>
<input type="text" id="supplier" readonly>
</div>

<button type="button" class="back-btn" onclick="smartBack()">Back</button>
</div>

<div class="goods-panel" id="goodsPanel">
<h2>Add Goods</h2>
<table>
<thead>
<tr>
<th>S.No</th>
<th>Description</th>
<th>Qty</th>
<th>Per</th>
</tr>
</thead>
<tbody id="goodsBody"></tbody>
</table>

<button class="update-btn" onclick="showConfirmPopup()">Update</button>

<div id="voucherWarning" style="display:none;color:red;margin-top:10px">
⚠ This voucher number already exists
</div>
</div>

</div>

<!-- Confirmation Modal -->
<div id="confirmModal">
<div class="modal-box">
<h3>Confirm Purchase Order</h3>
<div id="confirmContent"></div>
<div style="margin-top:20px; display:flex; gap:10px; justify-content: flex-end;">
<button class="confirm-btn" onclick="confirmSave()">Confirm</button>
<button class="cancel-btn" onclick="closeConfirm()">Cancel</button>
</div>
</div>
</div>

<script>
function showConfirmPopup(){
    let voucher = document.getElementById("voucher").value;
    let date = document.getElementById("poDate").value;
    let supplier = document.getElementById("supplier").value;

    if(!voucher) {
        alert("Please upload PDF first");
        return;
    }

    let rows = document.querySelectorAll("#goodsBody tr");
    let html = `
    <p><b>Voucher No:</b> ${voucher}</p>
    <p><b>Date:</b> ${date}</p>
    <p><b>Supplier:</b> ${supplier}</p>

    <table style="width:100%; margin-top:10px; border-collapse:collapse;">
    <thead>
        <tr style="background:#eee;">
            <th>S.No</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Per</th>
        </tr>
    </thead>
    <tbody>
    `;

    rows.forEach((row, i) => {
        let desc = row.querySelector(".desc")?.value || row.cells[1].querySelector("input")?.value || "";
        let qty = row.querySelector(".qty")?.value || row.cells[2].querySelector("input")?.value || "";
        let per = row.querySelector(".per")?.value || row.cells[3].querySelector("input")?.value || "";

        html += `
        <tr>
            <td>${i+1}</td>
            <td>${desc}</td>
            <td>${qty}</td>
            <td>${per}</td>
        </tr>`;
    });

    html += "</tbody></table>";

    document.getElementById("confirmContent").innerHTML = html;
    document.getElementById("confirmModal").style.display="flex";
}

function closeConfirm(){
    document.getElementById("confirmModal").style.display="none";
}

function confirmSave(){
    savePurchaseOrder(); 
}
</script>

<script src="../js/script.js"></script>

</body>
</html>
