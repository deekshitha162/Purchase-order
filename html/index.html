<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Order</title>

<style>

/* REMOVE ALL DEFAULT SPACE */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
}

/* ===== HEADER BAR ===== */
.header-bar{
    width:100%;
    height:70px;
    background:#000;
    display:flex;
    align-items:center;
    padding:0 30px;
    position: relative; /* Needed to center the title absolute to the bar */
}

/* Ensures the link around the logo behaves correctly */
.header-bar a {
    display: flex;
    align-items: center;
    z-index: 10;
}

.header-bar img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #000;
    background:#fff;
    cursor: pointer;
    transition: opacity 0.2s;
}

.header-bar img:hover {
    opacity: 0.8;
}

/* NEW RED TITLE STYLE */
.header-title {
    color: #dc8c8c; /* Red color */
    font-size: 22px;
    font-weight: bold;
    text-transform: uppercase;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
}

.wrapper{
    display:flex;
    justify-content:flex-start;
    gap:30px;
    align-items:flex-start;
    padding:30px;
}

/* LEFT PANEL */
.container{
    background:#fff;
    width:450px;
    padding:18px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* RIGHT PANEL */
.goods-panel{
    background:#fff;
    width:720px;
    padding:18px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    font-size:18px;
    margin-bottom:14px;
}

.field{
    margin-bottom:12px;
    position:relative;
}

label{
    font-size:13px;
    font-weight:bold;
    display:block;
    margin-bottom:4px;
}

input, select{
    width:100%;
    padding:7px;
    font-size:13px;
}

.voucher{
    display:flex;
}
.voucher span{
    padding:7px 12px;
    background:#eee;
    border:1px solid #ccc;
    border-right:none;
}
.voucher input{
    border:1px solid #ccc;
    border-left:none;
}

/* BUTTON STYLES */
.update-btn,
.back-btn{
    width:100%;
    padding:9px;
    margin-top:10px;
    font-size:14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:#fff;
}

.update-btn{ background:#28a745; }
.back-btn{ background:#0d6efd; }

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th, td{
    border:1px solid #ccc;
    padding:8px;
    font-size:13px;
    text-align:center;
}

th{
    background:#f2f2f2;
}

th:nth-child(1){ width:50px; }
th:nth-child(2){ width:280px; }
th:nth-child(3){ width:90px; }
th:nth-child(4){ width:90px; }
th:nth-child(5){ width:120px; }

.action-group{
    display:flex;
    justify-content:space-between;
}

.action-item{
    width:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
}

.icon-add{
    font-size:20px;
    color:green;
}

.icon-del{
    font-size:18px;
}

.action-text{
    font-size:11px;
    color:#555;
}

/* SUGGESTIONS */
.suggestions{
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    background:#fff;
    border:1px solid #ccc;
    max-height:150px;
    overflow-y:auto;
    display:none;
    z-index:1000;
}

.suggestions div{
    padding:6px;
    cursor:pointer;
}

.suggestions div:hover{
    background:#e9f2ff;
}

/* CONFIRM MODAL */
#confirmModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-box{
    background:#fff;
    width:650px;
    padding:18px;
    border-radius:8px;
}

.modal-box h3{
    margin-top:0;
    text-align:center;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:10px;
}
.small-warning {
    margin-top: 20px;
    padding: 8px 12px;
    background: #cdb774;
    color: #6b5207;
    border: 1px solid #13131368;
    border-radius: 6px;
    font-size: 14px;
    width: fit-content;
}

.confirm-btn,
.cancel-btn{
    padding:12px 24px;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.confirm-btn{
    background:#28a745;
    color:#fff;
}

.cancel-btn{
    background:#dc3545;
    color:#fff;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header-bar">
    <!-- Updated: Logo now links to home.html -->
    <a href="../html/home.html">
        <img src="../images/CEPL.jpg" alt="Confident Logo">
    </a>
    <span class="header-title">Purchase Order Management</span>
</div>

<div class="wrapper">

<!-- LEFT PANEL -->
<div class="container">
    <h2>Purchase Order</h2>

    <div class="field">
        <label>Voucher No</label>
        <div class="voucher">
            <span>POR/2526/</span>
            <input type="text" id="voucher" autocomplete="off">
        </div>
    </div>

    <div class="field">
        <label>Date</label>
        <input type="date" id="poDate">
    </div>

    <div class="field">
        <label>Supplier</label>
        <input type="text" id="supplier" autocomplete="off">
        <div class="suggestions" id="supplierSuggestions"></div>
    </div>

    <button type="button" class="back-btn" onclick="smartBack()">Back</button>

</div>

<!-- RIGHT PANEL -->
<div class="goods-panel" id="goodsPanel">
    <h2>Add Goods</h2>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Description</th>
                <th>Qty</th>
                <th>Per</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="goodsBody"></tbody>
    </table>

    <button class="update-btn" onclick="savePurchaseOrder()">Update</button>

<div id="voucherWarning" class="small-warning" style="display:none;">
    ⚠ This voucher number is already used
</div>

</div>

</div>

<!-- CONFIRM MODAL -->
<div id="confirmModal">
    <div class="modal-box">
        <h3>Confirm Purchase Order</h3>

        <div id="confirmContent"></div>

        <div class="modal-actions">
    <button type="button" class="confirm-btn" onclick="confirmSave()">Confirm</button>
    <button type="button" class="cancel-btn" onclick="closeConfirm()">Cancel</button>
</div>

    </div>
</div>


<script src="../js/script.js"></script>

</body>
</html>
