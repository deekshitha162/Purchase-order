<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEPL Store Management System</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com">

<style>
    /* Reset and Base Styles */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: url('https://images.unsplash.com') no-repeat center center/cover;
        position:relative;
        overflow: hidden;
    }

    /* Dark overlay */
    body::before{
        content:"";
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.75);
    }

    /* Glass container updated to Medium Size */
    .container{
        position:relative;
        text-align:center;
        background: rgba(255,255,255,0.05);
        padding: 40px 50px; /* Reduced padding for medium size */
        border-radius:30px;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        animation: fadeIn 1.2s ease-out;
        max-width: 820px; /* Set to Medium Width */
        width: 95%;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* New Welcome Header Style */
    .welcome-header {
        font-size: 16px;
        color: #00c6ff;
        margin-bottom: 8px;
        font-weight: 500;
        letter-spacing: 1px;
    }

    h1{
        font-size:32px; /* Slightly smaller for medium container */
        color:white;
        letter-spacing:3px;
        margin-bottom:8px;
        text-transform: uppercase;
    }

    .subtitle{
        color:#bbb;
        margin-bottom:40px;
        font-size:14px;
        letter-spacing: 1px;
    }

    /* Card Group Layout */
    .button-group{
        display:flex;
        gap:30px;
        justify-content:center;
        flex-wrap: wrap;
    }

    /* Individual Card Style */
    .card{
        background: rgba(255, 255, 255, 0.03);
        padding: 25px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 290px; /* Adjusted for medium layout */
    }

    .card:hover{
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-12px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        border-color: rgba(0, 198, 255, 0.3);
    }

    /* Illustration Images inside cards */
    .card-img{
        width: 100%;
        height: 160px;
        margin-bottom: 20px;
        border-radius: 12px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }

    .img-purchase{
    background-image: url("../images/purchase.jpg"); 
    }

     .img-view{
    background-image: url("../images/item.jpg"); 
    }

    /* Button Styles */
    .btn{
        width: 100%;
        padding:14px 20px;
        font-size:14px;
        border-radius:12px;
        cursor:pointer;
        transition:0.3s;
        font-weight:600;
        text-decoration:none;
        display:flex;
        align-items:center;
        justify-content: center;
        gap:10px;
        text-transform: uppercase;
    }

    .enter-btn{
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color:white;
        box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
    }

    .view-btn{
        background: linear-gradient(135deg, #ff6a00, #ee0979);
        color:white;
        box-shadow: 0 4px 15px rgba(255, 106, 0, 0.3);
    }

    .btn:hover {
        transform: scale(1.02);
    }

</style>
</head>

<body>

<div class="container">
    <!-- Updated: Welcome Message at top -->
    <div class="welcome-header">
        Welcome back! Ready to Manage your inventory? 🚀
    </div>

    <h1>CEPL STORE MANAGEMENT</h1>
    <div class="subtitle">Electronics Purchase & Inventory Control Portal</div>

    <div class="button-group">
        <!-- Card 1: Enter Purchase -->
        <div class="card">
            <div class="card-img img-purchase"></div>
            <a href="../html/index.html" class="btn enter-btn">
                <i class="fa-solid fa-cart-plus"></i>
                Enter Purchase Order
            </a>
        </div>

        <!-- Card 2: View Orders -->
        <div class="card">
            <div class="card-img img-view"></div>
            <a href="../html/po_report.html" class="btn view-btn">
                <i class="fa-solid fa-chart-line"></i>
                View Purchase Orders
            </a>
        </div>
    </div>
</div>

</body>
</html>
